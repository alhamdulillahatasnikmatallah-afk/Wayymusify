name: Build WayyMusify APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WayyMusify Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # EXTRACT PROJECT ZIP
      # ============================================================
      - name: Extract WayyMusify.zip
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Repository contents"
          echo "========================================"

          ls -lah

          if [ ! -f "WayyMusify.zip" ]; then
            echo "::error::WayyMusify.zip not found!"
            exit 1
          fi

          echo ""
          echo "Extracting WayyMusify.zip..."

          rm -rf WayyMusify
          unzip -q -o WayyMusify.zip

          echo ""
          echo "========================================"
          echo "Extracted project"
          echo "========================================"

          ls -lah WayyMusify


      # ============================================================
      # DETECT / VALIDATE PROJECT
      # ============================================================
      - name: Validate project
        working-directory: WayyMusify
        shell: bash
        run: |
          set -e

          echo "Checking Gradle project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/build.gradle.kts

          echo ""
          echo "Project structure OK."


      # ============================================================
      # JAVA 21
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # ANDROID LICENSES
      # ============================================================
      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true


      # ============================================================
      # ANDROID SDK 37
      # ============================================================
      - name: Install Android SDK 37
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0"

          echo ""
          echo "Android SDK installed."


      # ============================================================
      # GRADLE PERMISSION
      # ============================================================
      - name: Grant execute permission for gradlew
        working-directory: WayyMusify
        run: chmod +x gradlew


      # ============================================================
      # SHOW ENVIRONMENT
      # ============================================================
      - name: Show build environment
        working-directory: WayyMusify
        shell: bash
        run: |
          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version

          echo ""
          echo "========================================"
          echo "GRADLE"
          echo "========================================"
          ./gradlew --version

          echo ""
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          sdkmanager --list_installed | \
            grep -E "platform-tools|platforms;android-37|build-tools;37" || true


      # ============================================================
      # CLEAN
      # ============================================================
      - name: Clean project
        working-directory: WayyMusify
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # BUILD RELEASE APK
      #
      # Variant:
      #
      # GMS
      # MOBILE
      # UNIVERSAL
      # RELEASE
      #
      # Result:
      # gmsMobileUniversalRelease
      # ============================================================
      - name: Build GMS Mobile Universal Release APK
        working-directory: WayyMusify
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx4g
            -Dorg.gradle.parallel=true
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDING WAYYMUSIFY"
          echo "========================================"

          ./gradlew \
            :app:assembleGmsMobileUniversalRelease \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-build.log


      # ============================================================
      # FIND APK
      # ============================================================
      - name: Find APK
        if: success()
        working-directory: WayyMusify
        shell: bash
        run: |
          echo "========================================"
          echo "GENERATED APK FILES"
          echo "========================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | wc -l)

          echo ""
          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK generated!"
            exit 1
          fi


      # ============================================================
      # PREPARE APK
      # ============================================================
      - name: Prepare APK artifact
        if: success()
        working-directory: WayyMusify
        shell: bash
        run: |
          set -e

          mkdir -p release-artifacts

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          echo "APK:"
          echo "$APK"

          cp "$APK" \
            release-artifacts/WayyMusify-gms-mobile-universal-release.apk

          echo ""
          ls -lh release-artifacts/


      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WayyMusify-APK
          path: WayyMusify/release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # COLLECT DEBUG INFORMATION
      #
      # JIKA BUILD GAGAL:
      # Semua log penting dikumpulkan.
      # ============================================================
      - name: Collect debug logs
        if: failure()
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD FAILED"
          echo "COLLECTING DEBUG INFORMATION"
          echo "========================================"

          mkdir -p debug-package

          # Gradle log
          if [ -f "gradle-build.log" ]; then
            cp gradle-build.log debug-package/
          fi

          # Gradle project reports
          if [ -d "WayyMusify/app/build/reports" ]; then
            cp -r WayyMusify/app/build/reports \
              debug-package/app-reports
          fi

          # Root build reports
          if [ -d "WayyMusify/build/reports" ]; then
            cp -r WayyMusify/build/reports \
              debug-package/root-reports
          fi

          # Gradle configuration
          if [ -f "WayyMusify/gradle/wrapper/gradle-wrapper.properties" ]; then
            cp WayyMusify/gradle/wrapper/gradle-wrapper.properties \
              debug-package/
          fi

          # Build scripts
          cp WayyMusify/build.gradle.kts \
            debug-package/ 2>/dev/null || true

          cp WayyMusify/settings.gradle.kts \
            debug-package/ 2>/dev/null || true

          cp WayyMusify/app/build.gradle.kts \
            debug-package/ 2>/dev/null || true

          # Environment information
          {
            echo "=== DATE ==="
            date

            echo ""
            echo "=== JAVA ==="
            java -version

            echo ""
            echo "=== GRADLE ==="
            cd WayyMusify
            ./gradlew --version || true

            echo ""
            echo "=== GIT COMMIT ==="
            git rev-parse HEAD || true

            echo ""
            echo "=== PROJECT FILES ==="
            find . -maxdepth 3 -type f \
              | sort \
              | head -500

          } > debug-package/environment.txt

          echo ""
          echo "========================================"
          echo "DEBUG PACKAGE CONTENTS"
          echo "========================================"

          find debug-package -type f -print


      # ============================================================
      # ZIP DEBUG LOG
      # ============================================================
      - name: Zip debug logs
        if: failure()
        shell: bash
        run: |
          set -e

          zip -r \
            WayyMusify-debug.zip \
            debug-package

          echo ""
          echo "Debug ZIP created:"
          ls -lh WayyMusify-debug.zip


      # ============================================================
      # UPLOAD DEBUG ZIP
      # ============================================================
      - name: Upload debug ZIP
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WayyMusify-debug
          path: WayyMusify-debug.zip
          if-no-files-found: error
          retention-days: 14

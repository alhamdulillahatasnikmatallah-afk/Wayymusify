name: WayyMusify Debug Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: WayyMusify - Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dfile.encoding=UTF-8
      JAVA_VERSION: "21"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. CHECK ZIP
      # ============================================================
      - name: Check repository
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "REPOSITORY"
          echo "========================================"

          pwd
          ls -lah

          if [ ! -f "WayyMusify.zip" ]; then
            echo "::error::WayyMusify.zip tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "WayyMusify.zip ditemukan:"
          ls -lh WayyMusify.zip


      # ============================================================
      # 3. EXTRACT PROJECT
      # ============================================================
      - name: Extract WayyMusify project
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf WayyMusify

          unzip -q -o WayyMusify.zip

          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"

          ls -lah WayyMusify

          echo ""
          echo "Top-level files:"
          find WayyMusify -maxdepth 2 -type f | sort | head -300


      # ============================================================
      # 4. VALIDATE GRADLE PROJECT
      # ============================================================
      - name: Validate Gradle project
        working-directory: WayyMusify
        shell: bash
        run: |
          set -euxo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo ""
          echo "Gradle project structure OK."


      # ============================================================
      # 5. JAVA 21
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle


      # ============================================================
      # 6. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 7. ACCEPT LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -o pipefail

          yes | sdkmanager --licenses 2>&1 \
            | tee android-licenses.log || true


      # ============================================================
      # 8. INSTALL SDK
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0"

          echo ""
          echo "Installed Android SDK packages:"
          sdkmanager --list_installed


      # ============================================================
      # 9. ENVIRONMENT DIAGNOSTICS
      # ============================================================
      - name: Environment diagnostics
        working-directory: WayyMusify
        shell: bash
        run: |
          set -o pipefail

          mkdir -p ../debug-package

          {
            echo "========================================"
            echo "DATE"
            echo "========================================"
            date

            echo ""
            echo "========================================"
            echo "JAVA"
            echo "========================================"
            java -version

            echo ""
            echo "========================================"
            echo "JAVA HOME"
            echo "========================================"
            echo "$JAVA_HOME"

            echo ""
            echo "========================================"
            echo "GRADLE VERSION"
            echo "========================================"
            ./gradlew --version

            echo ""
            echo "========================================"
            echo "ANDROID SDK"
            echo "========================================"
            echo "$ANDROID_HOME"

            echo ""
            echo "========================================"
            echo "SDK PACKAGES"
            echo "========================================"
            sdkmanager --list_installed

            echo ""
            echo "========================================"
            echo "GRADLE WRAPPER"
            echo "========================================"
            cat gradle/wrapper/gradle-wrapper.properties

            echo ""
            echo "========================================"
            echo "GIT COMMIT"
            echo "========================================"
            git rev-parse HEAD

          } 2>&1 | tee ../debug-package/environment.log


      # ============================================================
      # 10. SHOW ALL GRADLE TASKS
      #
      # Ini penting untuk memastikan:
      # assembleGmsMobileUniversalRelease
      # memang tersedia.
      # ============================================================
      - name: List Gradle tasks
        working-directory: WayyMusify
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            :app:tasks \
            --all \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-tasks.log


      # ============================================================
      # 11. VERIFY TARGET VARIANT
      # ============================================================
      - name: Verify GMS Mobile Universal Release variant
        working-directory: WayyMusify
        shell: bash
        run: |
          set -o pipefail

          echo "Checking target variant..."

          ./gradlew \
            :app:assembleGmsMobileUniversalRelease \
            --dry-run \
            --no-daemon \
            --stacktrace \
            2>&1 | tee ../variant-check.log


      # ============================================================
      # 12. BUILD APK
      #
      # Tidak menjalankan clean.
      # Runner GitHub Actions adalah environment baru.
      # ============================================================
      - name: Build WayyMusify Release APK
        working-directory: WayyMusify
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "START BUILD"
          echo "========================================"

          ./gradlew \
            :app:assembleGmsMobileUniversalRelease \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-build.log


      # ============================================================
      # 13. FIND APK
      # ============================================================
      - name: Find generated APK
        if: success()
        working-directory: WayyMusify
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          find app/build/outputs \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          APK_COUNT=$(find app/build/outputs \
            -type f \
            -name "*.apk" \
            | wc -l)

          echo ""
          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi


      # ============================================================
      # 14. PREPARE APK
      # ============================================================
      - name: Prepare APK artifact
        if: success()
        working-directory: WayyMusify
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p release-artifacts

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          echo "Selected APK:"
          echo "$APK"

          cp "$APK" \
            release-artifacts/WayyMusify-gms-mobile-universal-release.apk

          echo ""
          ls -lh release-artifacts/


      # ============================================================
      # 15. UPLOAD APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WayyMusify-APK
          path: WayyMusify/release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 16. COLLECT FAILURE INFORMATION
      #
      # Dijalankan kalau STEP APAPUN gagal.
      # ============================================================
      - name: Collect complete debug information
        if: always()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "COLLECTING DEBUG INFORMATION"
          echo "========================================"

          rm -rf debug-package
          mkdir -p debug-package

          # --------------------------------------------------------
          # Logs
          # --------------------------------------------------------

          for file in \
            android-licenses.log \
            gradle-tasks.log \
            variant-check.log \
            gradle-build.log
          do
            if [ -f "$file" ]; then
              cp "$file" debug-package/
            fi
          done


          # --------------------------------------------------------
          # Environment
          # --------------------------------------------------------

          if [ -d "WayyMusify" ]; then
            {
              echo "========================================"
              echo "DATE"
              echo "========================================"
              date

              echo ""
              echo "========================================"
              echo "JAVA"
              echo "========================================"
              java -version

              echo ""
              echo "========================================"
              echo "JAVA HOME"
              echo "========================================"
              echo "$JAVA_HOME"

              echo ""
              echo "========================================"
              echo "GRADLE VERSION"
              echo "========================================"
              cd WayyMusify
              ./gradlew --version

              echo ""
              echo "========================================"
              echo "GIT COMMIT"
              echo "========================================"
              git rev-parse HEAD || true

            } > debug-package/final-environment.log 2>&1
          fi


          # --------------------------------------------------------
          # Gradle wrapper
          # --------------------------------------------------------

          if [ -f "WayyMusify/gradle/wrapper/gradle-wrapper.properties" ]; then
            cp \
              WayyMusify/gradle/wrapper/gradle-wrapper.properties \
              debug-package/
          fi


          # --------------------------------------------------------
          # Gradle configuration
          # --------------------------------------------------------

          mkdir -p debug-package/config

          cp WayyMusify/build.gradle.kts \
            debug-package/config/ 2>/dev/null || true

          cp WayyMusify/settings.gradle.kts \
            debug-package/config/ 2>/dev/null || true

          cp WayyMusify/gradle.properties \
            debug-package/config/ 2>/dev/null || true

          cp WayyMusify/app/build.gradle.kts \
            debug-package/config/ 2>/dev/null || true

          cp WayyMusify/gradle/libs.versions.toml \
            debug-package/config/ 2>/dev/null || true


          # --------------------------------------------------------
          # Build reports
          # --------------------------------------------------------

          if [ -d "WayyMusify/app/build/reports" ]; then
            cp -r \
              WayyMusify/app/build/reports \
              debug-package/app-build-reports
          fi

          if [ -d "WayyMusify/build/reports" ]; then
            cp -r \
              WayyMusify/build/reports \
              debug-package/root-build-reports
          fi


          # --------------------------------------------------------
          # Build intermediates / metadata
          # --------------------------------------------------------

          if [ -d "WayyMusify/app/build" ]; then
            find WayyMusify/app/build \
              -maxdepth 4 \
              -type f \
              \( \
                -name "*.xml" -o \
                -name "*.json" -o \
                -name "*.txt" \
              \) \
              | head -1000 \
              > debug-package/build-files.txt
          fi


          # --------------------------------------------------------
          # Project structure
          # --------------------------------------------------------

          if [ -d "WayyMusify" ]; then
            find WayyMusify \
              -maxdepth 4 \
              -type f \
              | sort \
              | head -3000 \
              > debug-package/project-files.txt
          fi


          # --------------------------------------------------------
          # Git information
          # --------------------------------------------------------

          {
            echo "Repository:"
            git remote -v

            echo ""
            echo "Commit:"
            git rev-parse HEAD

            echo ""
            echo "Branch:"
            git branch --show-current

            echo ""
            echo "Status:"
            git status --short

          } > debug-package/git-info.txt 2>&1


          # --------------------------------------------------------
          # Disk / memory
          # --------------------------------------------------------

          {
            echo "=== DISK ==="
            df -h

            echo ""
            echo "=== MEMORY ==="
            free -h

            echo ""
            echo "=== CPU ==="
            nproc

          } > debug-package/system-info.txt 2>&1


          # --------------------------------------------------------
          # Directory listing
          # --------------------------------------------------------

          find debug-package \
            -type f \
            | sort \
            > debug-package/contents.txt


          echo ""
          echo "========================================"
          echo "DEBUG PACKAGE"
          echo "========================================"

          find debug-package \
            -type f \
            | sort


      # ============================================================
      # 17. ZIP DEBUG PACKAGE
      # ============================================================
      - name: Create debug ZIP
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          rm -f WayyMusify-debug.zip

          zip -r \
            WayyMusify-debug.zip \
            debug-package

          echo ""
          echo "========================================"
          echo "DEBUG ZIP CREATED"
          echo "========================================"

          ls -lh WayyMusify-debug.zip


      # ============================================================
      # 18. UPLOAD DEBUG ZIP
      # ============================================================
      - name: Upload debug ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WayyMusify-debug
          path: WayyMusify-debug.zip
          if-no-files-found: error
          retention-days: 14

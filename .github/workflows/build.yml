name: Build WayyMusify APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract WayyMusify.zip
        run: |
          echo "=== Files in repo ==="
          ls -la
          if [ -f "WayyMusify.zip" ]; then
            echo "Found WayyMusify.zip — extracting..."
            unzip -o WayyMusify.zip
            echo "=== After extract ==="
            ls -la
          else
            echo "ERROR: WayyMusify.zip not found in repo root"
            exit 1
          fi

      - name: Detect project root
        id: proj
        run: |
          if [ -f "WayyMusify/settings.gradle.kts" ]; then
            echo "dir=WayyMusify" >> $GITHUB_OUTPUT
            echo "Using folder: WayyMusify/"
          elif [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
            echo "Using root"
          else
            echo "Project not found after extract"
            find . -name "settings.gradle.kts" | head -10
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        working-directory: ${{ steps.proj.outputs.dir }}
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true"

      - name: Find and list APKs
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          echo "=== Looking for APKs ==="
          find . -name "*.apk" -type f
          ls -lah app/build/outputs/apk/*/release/ 2>/dev/null || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wayymusify-apks
          path: |
            ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
